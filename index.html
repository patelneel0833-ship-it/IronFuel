<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080c"><title>Gym + FuelTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#07080c;--tx:#f4f5f8;--mu:#8a90a0}*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Outfit","Avenir Next",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 40% at 85% 0%,#ff7a1a30,transparent 70%),radial-gradient(55% 40% at 0% 100%,#6366f13a,transparent 70%)}
#home{position:relative;z-index:1;min-height:100%;display:grid;align-content:center;gap:16px;max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
.eyebrow{color:var(--mu);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(32px,9vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:4px 0 10px}
.tile{position:relative;overflow:hidden;border-radius:30px;padding:24px;border:1px solid #ffffff1c;background:#ffffff0b;text-align:left;color:inherit;font:inherit;cursor:pointer;display:grid;gap:12px;min-height:190px;transition:transform .15s,border-color .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tile:active{transform:scale(.98)}.tile:hover{border-color:var(--c1)}
.tile::before{content:"";position:absolute;right:-18%;bottom:-45%;width:75%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 65%);opacity:.38;pointer-events:none}
.gym{--c1:#ff7a1a;--c2:#ff3d6e}.fuel{--c1:#6366f1;--c2:#22d3ee}
.ico{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 28px -10px var(--c1)}
.ico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block}.tile span.d{color:var(--mu);font-size:14px}
.go{position:absolute;right:22px;top:22px;font-size:13px;font-weight:700;color:var(--mu)}.last{color:var(--c1)!important}
.sync{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:13px;line-height:1.4;padding:6px 4px}.sync i{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;flex:none}
#shell{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:#0b0c11;border-bottom:1px solid #ffffff14;flex:none}
#back{background:#ffffff12;border:0;color:var(--tx);font:inherit;font-weight:700;font-size:14px;border-radius:99px;padding:7px 14px;cursor:pointer}
#ttl{flex:1;text-align:center;font-weight:700;font-size:15px}
#sy{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);min-width:84px;justify-content:flex-end}#sy i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
#sy.w i{background:#fbbf24;box-shadow:0 0 8px #fbbf24;animation:p 1s infinite}#sy.e i{background:#f87171;box-shadow:0 0 8px #f87171}@keyframes p{50%{opacity:.3}}
#fr{flex:1;width:100%;border:0;background:#000}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const dec=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)};
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||''),rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const jget=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}},jset=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
/* ---- storage access (both apps share this page's origin) ---- */
const STORES=['workouts','exercises','routines','body','recovery','nutrition','settings','achievements','photos'];
const gdb=()=>new Promise((ok,no)=>{const r=indexedDB.open('gym-intelligence',1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=q=>new Promise((ok,no)=>{q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function readGym(){const db=await gdb();try{const body=await rq(db.transaction('body').objectStore('body').getAll()),set=await rq(db.transaction('settings').objectStore('settings').get('main')),W={},X={};
body.sort((a,b)=>a.t-b.t).forEach(b=>{const d=ymd(b.t);if(b.weight>0)W[d]=b.weight;if(b.waist>0)X[d]=b.waist});return{W,X,T:set&&set.target!=null?set.target:null}}finally{db.close()}}
function readFuel(){const g=jget('ft_goals',{})||{},W={},X={};(Array.isArray(g.weightLog)?g.weightLog:[]).forEach(e=>{if(e&&isD(e.date)){const v=parseFloat(e.weight);if(v>0)W[e.date]=v}});(jget('ft_waist',[])||[]).forEach(e=>{if(e&&isD(e.date)){const v=parseFloat(e.waist);if(v>0)X[e.date]=v}});return{W,X,T:typeof g.targetWeight==='number'?g.targetWeight:null}}
async function applyGym(k,df){const db=await gdb();try{
 if(k==='T'){const st=db.transaction('settings','readwrite').objectStore('settings'),s=await rq(st.get('main'));if(s){s.target=df.v;await rq(st.put(s))}return}
 const f=k==='W'?'weight':'waist',tx=db.transaction('body','readwrite'),st=tx.objectStore('body'),all=await rq(st.getAll());
 for(const d of df.del)for(const e of all.filter(e=>ymd(e.t)===d&&e[f]>0)){delete e[f];if(Object.keys(e).some(x=>!['id','t','note'].includes(x)))await rq(st.put(e));else await rq(st.delete(e.id))}
 for(const d in df.set){const e=all.find(e=>ymd(e.t)===d&&e[f]>0);if(e){e[f]=df.set[d];await rq(st.put(e))}else await rq(st.put({id:rid(),t:new Date(d+'T12:00').getTime(),[f]:df.set[d]}))}}finally{db.close()}}
function applyFuel(k,df){const g=jget('ft_goals',{})||{};
 if(k==='T'){if(df.v==null)delete g.targetWeight;else g.targetWeight=df.v;return jset('ft_goals',g)}
 const f=k==='W'?'weight':'waist';let log=k==='W'?(Array.isArray(g.weightLog)?g.weightLog:[]):(jget('ft_waist',[])||[]);
 log=log.filter(e=>!(e&&(df.del.includes(e.date)||e.date in df.set)));for(const d in df.set)log.push({id:rid(),date:d,[f]:df.set[d]});
 if(k==='W'){g.weightLog=log;const s=log.filter(e=>e&&isD(e.date)&&parseFloat(e.weight)>0).sort((a,b)=>a.date<b.date?-1:1);if(s.length)g.weight=parseFloat(s[s.length-1].weight);jset('ft_goals',g)}else jset('ft_waist',log)}
const diff=(cur,snap)=>{const set={},del=[];for(const d in cur)if(!(d in snap)||Math.abs(snap[d]-cur[d])>.001)set[d]=cur[d];for(const d in snap)if(!(d in cur))del.push(d);return{set,del}};
const nOf=df=>Object.keys(df.set).length+df.del.length,apply=(dst,k,df)=>dst==='gym'?applyGym(k,df):applyFuel(k,df);
let busy=false,active=null,timer=0;
function status(c,t){const s=$('#sy');s.className=c;s.querySelector('em').textContent=t}
async function bootstrap(){const G=await readGym(),F=readFuel(),M={W:{...G.W,...F.W},X:{...G.X,...F.X},T:F.T!=null?F.T:G.T};
 for(const k of['W','X']){const a=diff(M[k],G[k]),b=diff(M[k],F[k]);if(nOf(a))await applyGym(k,a);if(nOf(b))applyFuel(k,b)}
 if(M.T!==G.T)await applyGym('T',{v:M.T});if(M.T!==F.T)applyFuel('T',{v:M.T});jset('mx_snap',M);return M}
async function syncFrom(src){if(!src)return;while(busy)await new Promise(r=>setTimeout(r,60));busy=true;if(active)status('w','Syncing');
 try{const S=jget('mx_snap',null);if(!S)await bootstrap();else{const cur=src==='gym'?await readGym():readFuel(),dst=src==='gym'?'fuel':'gym';let n=0;
  for(const k of['W','X']){const df=diff(cur[k],S[k]||{});if(nOf(df)){await apply(dst,k,df);n+=nOf(df)}}
  if(cur.T!==S.T){await apply(dst,'T',{v:cur.T});n++}
  jset('mx_snap',{W:cur.W,X:cur.X,T:cur.T});if(n&&active)status('',n+' synced')}
  if(active&&!$('#sy').textContent.includes('synced'))status('','Synced')}
 catch(e){console.error(e);if(active)status('e','Sync off')}finally{busy=false}}
/* ---- launcher ---- */
function markLast(){const l=localStorage.getItem('mx_last');document.querySelectorAll('[data-go]').forEach(e=>{const on=e.dataset.go===l;e.textContent=on?'Last used · Open →':'Open →';e.classList.toggle('last',on)})}
async function openApp(k){await syncFrom(localStorage.getItem('mx_last'));active=k;localStorage.setItem('mx_last',k);$('#ttl').textContent=NAME[k];status('','Synced');
 $('#home').style.display='none';$('#shell').style.display='flex';$('#fr').srcdoc=dec(SRC[k]);timer=setInterval(()=>syncFrom(active),2500)}
async function closeApp(){const a=active;await syncFrom(a);clearInterval(timer);active=null;$('#fr').removeAttribute('srcdoc');$('#fr').src='about:blank';$('#shell').style.display='none';$('#home').style.display='grid';markLast()}
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));$('#back').onclick=closeApp;
addEventListener('pagehide',()=>{if(active)syncFrom(active)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)syncFrom(active)});
markLast();syncFrom(localStorage.getItem('mx_last')||'fuel');
</script></body></html>
